<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #222;
        }
        /* 导航栏 */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 60px;
        }
        .logo {
            width: 48px;
            height: 48px;
        }
        nav ul {
            display: flex;
            gap: 40px;
            list-style: none;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            padding: 8px 14px;
            border-radius: 999px;
            transition: 0.25s;
        }
        nav a.active {
            background-color: #000;
            color: #fff;
        }
        nav a:hover:not(.active) {
            background-color: #f3f4f6;
        }
        /* 主容器 */
        main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 60px;
            min-height: 75vh;
        }
        .text-area {
            flex: 1;
        }
        .avatar-wrap {
            flex: 0 0 420px;
            position: relative;
        }
        .avatar {
            width: 340px;
            border-radius: 12px;
            /* 青绿色轮廓描边，和截图效果一致 */
            outline: 3px solid #22d3a1;
            outline-offset: 6px;
        }
        h1 {
            font-size: 72px;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        .subtitle {
            font-size: 32px;
            color: #9333ea;
            margin-bottom: 20px;
        }
        .desc {
            font-size: 16px;
            color: #555;
            max-width: 460px;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-bottom: 48px;
        }
        button {
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-download {
            border: 2px solid #000;
            background: #fff;
        }
        .btn-contact {
            background-color: #dcfce7;
            color: #16a34a;
        }
        /* AI岗位匹配器 */
        .match-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7f8fa;
            padding: 12px 16px;
            border-radius: 999px;
            max-width: 520px;
        }
        .match-box input {
            flex:1;
            border: none;
            background: transparent;
            outline: none;
            font-size:15px;
        }
        .match-box button {
            background: black;
            color:white;
            padding:10px 22px;
        }
        /* Tab内容区域（切换面板） */
        .tab-panel {
            display: none;
            padding: 20px 60px;
            max-width: 1000px;
        }
        .tab-panel.active {
            display: block;
            animation: fade 0.35s ease;
        }
        @keyframes fade {
            from {opacity:0; transform: translateY(12px);}
            to {opacity:1; transform: translateY(0);}
        }
        .tab-panel h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .tab-panel p {
            font-size:16px;
            color:#444;
            line-height:1.7;
        }
        @media (max-width:900px) {
            main {flex-direction:column;}
            h1 {font-size:48px;}
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">👩</div>
        <nav>
            <ul>
                <li><a href="#about" class="nav-link active" data-target="about">关于我</a></li>
                <li><a href="#edu" class="nav-link" data-target="edu">教育背景</a></li>
                <li><a href="#project" class="nav-link" data-target="project">项目经历</a></li>
                <li><a href="#skill" class="nav-link" data-target="skill">技能特长</a></li>
                <li><a href="#explore" class="nav-link" data-target="explore">学习与探索</a></li>
            </ul>
        </nav>
    </header>

    <!-- 首页Hero面板（关于我） -->
    <div class="tab-panel active" id="about">
        <main>
            <div class="text-area">
                <h1>Hi，我是XXX</h1>
                <div class="subtitle">AI视觉开发工程师</div>
                <p class="desc">在这里填写简介，描述你的技术方向、擅长领域、求职目标。</p>
                <div class="btn-group">
                    <button class="btn-download">下载简历</button>
                    <button class="btn-contact">联系我</button>
                </div>
                <div class="match-box">
                    <input placeholder="粘贴您的JD，查看与岗位之间的匹配度">
                    <button>开始匹配 →</button>
                </div>
            </div>
            <div class="avatar-wrap">
                <!-- 这里直接引用同目录的头像.jpg -->
                <img class="avatar" src="./头像.jpg" alt="头像">
            </div>
        </main>
    </div>

    <!-- 教育背景 -->
    <div class="tab-panel" id="edu">
        <h2>教育背景</h2>
        <p>学校、专业、时间、GPA、排名、主修课程、获奖信息等内容。</p>
    </div>

    <!-- 项目经历 -->
    <div class="tab-panel" id="project">
        <h2>项目经历</h2>
        <p>在这里填写你的项目，每个项目可以写项目名称、时间、技术栈、成果指标。</p>
    </div>

    <!-- 技能特长 -->
    <div class="tab-panel" id="skill">
        <h2>技能特长</h2>
        <p>编程语言、框架、硬件工具、证书等技能内容。</p>
    </div>

    <!-- 学习与探索 -->
    <div class="tab-panel" id="explore">
        <h2>学习与探索</h2>
        <p>学习笔记、技术博客、竞赛、开源、持续学习内容。</p>
    </div>

<script>
    const navLinks = document.querySelectorAll('.nav-link');
    const panels = document.querySelectorAll('.tab-panel');

    navLinks.forEach(link => {
        link.onclick = function(e) {
            e.preventDefault();
            // 清除所有激活
            navLinks.forEach(a=>a.classList.remove('active'));
            panels.forEach(p=>p.classList.remove('active'));
            // 当前激活
            this.classList.add('active');
            const targetId = this.dataset.target;
            document.getElementById(targetId).classList.add('active');
        }
    })
</script>
</body>
</html>
